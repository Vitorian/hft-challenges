title: "Challenge 17: Cross-CCX Ring Buffer"
slug: cross-ccx-ring
track: cpp_latency
description: |
  Same interface as [Challenge 05](/challenge/ring-buffer) — but the producer
  and consumer now run on **different CCXes** with separate L3 caches.

  ### Why This Matters

  On any multi-CCX AMD chip (Ryzen 3000+, EPYC) or multi-die Intel Xeon,
  core pairs that share an L3 are the minority: most core-to-core
  communication crosses a fabric interconnect, and the cost shows up as
  P99 jitter that nobody traces back to cache topology. The same ring
  design wins on both topologies; what changes is that every cache line
  transfer is now the dominant cost, so the designs that pipeline those
  transfers pull ahead.

  ### What is a CCX?

  AMD Ryzen and EPYC processors are built from **Core Complexes (CCXes)** —
  groups of 3-4 cores that share an L3 cache. Multiple CCXes are connected
  via the **Infinity Fabric (IF)**, an on-die interconnect. Intel uses a
  similar topology — multi-die Xeons use the **EMIB** interconnect between
  tiles, and even consumer chips (Alder Lake+) split cores into clusters
  with separate cache domains.

  In Challenge 05, both threads share the same L3. A cache line bounce
  between cores costs ~10-15ns. In this challenge, every cache line that
  crosses between CCXes travels through the Infinity Fabric at **~70-80ns
  on Zen 2** (~40-50ns on Zen 4/5). Your Challenge 05 solution will work,
  and the penalty is additive: on this feed a plain one-slot-per-line ring
  with cached indices pays about 680 cycles per message more than it does
  on Challenge 05. The best designs pipeline the fabric transfers (prefetch
  several slots ahead on both sides, publish a slot in one write) and hide
  half of that. **The gold line is the Challenge 05 gold line**: gold here
  means the crossing is hidden entirely; the plain ring lands at silver.

  ### API

  Identical to Challenge 05:

  ```cpp
  namespace hftu {
  class RingBuffer {
  public:
      explicit RingBuffer(size_t capacity);
      bool push(const Message& msg);
      bool pop(Message& out);
      size_t size() const;
  };
  }
  ```

  - Capacity is always a power of 2
  - Must be thread-safe for one producer + one consumer (no mutexes)
  - `pop()` must return every field exactly as it was pushed, for any value of
    the field's type. Narrowing or compressing fields to fit the values the
    benchmark happens to use is not allowed. Each run is checked for this and
    by a concurrent stress test (small capacities, random timing).
  - Producer and consumer run on separate CCXes (separate L3 caches)

  ### Hints

  - Count the number of cache lines that cross the Infinity Fabric per
    operation in your current solution.
  - Ask yourself: which of those crossings are strictly necessary?

  ### Getting Started

  ```bash
  cd challenge-17-cross-ccx-ring
  cmake -B build -DCMAKE_BUILD_TYPE=Release
  cmake --build build
  ./build/benchmark
  ```

  > **Tip:** Your Challenge 05 solution is a valid starting point. Submit it
  > first to see the cross-CCX penalty, then optimize from there.

  > **Note:** The public benchmark you run locally uses a different seed and
  > workload than the certified benchmark on the server. Your local score may
  > differ significantly from your submitted score.
